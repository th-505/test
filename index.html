<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تجميع وتنزيل HLS كملف واحد</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6b46c1;
      --accent-hover: #553c9a;
      --ok: #10b981;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    h1 { margin: 0 0 6px; font-size: 1.3rem; }
    .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; }
    label { display: block; margin-top: 12px; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.86rem;
      direction: ltr;
      text-align: left;
    }
    textarea { min-height: 90px; resize: vertical; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .prog {
      margin-top: 14px;
      height: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: var(--ok);
      transition: width 0.15s;
    }
    .status {
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid var(--border);
      font-size: 0.86rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>تجميع وتنزيل الفيديو كملف واحد (بدون سيرفر)</h1>
    <div class="sub" id="expBanner">جاري فحص صلاحية expires...</div>

    <label for="m3u8Url">رابط المجمع (.m3u8):</label>
    <input
      type="text"
      id="m3u8Url"
      value="https://s9.ukrcdn.xyz/hls/a4cb38d5-1b6a-42fa-a62d-635d4d838140/720p/720p.m3u8?token=504320e7fb67e95795befd6e47fa2e02ba908b42792cf6e75510ecee87c66b07&expires=1795096923"
    />

    <div class="grid">
      <div>
        <label for="startIdx">من مقطع:</label>
        <input type="number" id="startIdx" min="0" value="0" />
      </div>
      <div>
        <label for="endIdx">إلى مقطع (فارغ = الكل):</label>
        <input type="number" id="endIdx" min="0" value="" placeholder="حتى النهاية" />
      </div>
      <div>
        <label for="fileName">اسم الملف:</label>
        <input type="text" id="fileName" value="video_720p_full" />
      </div>
      <div>
        <label for="extSelect">الامتداد:</label>
        <select id="extSelect">
          <option value="ts" selected>.ts (مباشر وسريع)</option>
          <option value="mp4">.mp4</option>
        </select>
      </div>
    </div>

    <label for="rawList">محتوى القائمة (.m3u8) — يُجلب تلقائياً أو يُلصق هنا:</label>
    <textarea id="rawList" placeholder="#EXTM3U ..."></textarea>

    <div class="btns">
      <button id="btnStart">تجميع وتنزيل كملف واحد</button>
      <button id="btnStop" class="danger" disabled>إيقاف</button>
    </div>

    <div class="prog"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">جاهز. اضغط "تجميع وتنزيل كملف واحد".</div>
  </div>

  <script>
    const m3u8UrlEl = document.getElementById('m3u8Url');
    const startIdxEl = document.getElementById('startIdx');
    const endIdxEl = document.getElementById('endIdx');
    const fileNameEl = document.getElementById('fileName');
    const extSelectEl = document.getElementById('extSelect');
    const rawListEl = document.getElementById('rawList');
    const expBannerEl = document.getElementById('expBanner');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const barEl = document.getElementById('bar');
    const statusEl = document.getElementById('status');

    let controller = null;

    function updateExpiry() {
      try {
        const u = new URL(m3u8UrlEl.value.trim());
        const exp = Number(u.searchParams.get('expires'));
        if (!exp) {
          expBannerEl.textContent = 'لا يوجد expires في الرابط.';
          return;
        }
        const now = Math.floor(Date.now() / 1000);
        const rem = exp - now;
        const riyadh = new Date(exp * 1000).toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' });
        expBannerEl.innerHTML = rem > 0
          ? `صلاحية الرابط تنتهي (الرياض): <b>${riyadh}</b> — المتبقي ~<b>${Math.floor(rem / 60)}</b> دقيقة.`
          : `<span style="color:#f87171">انتهت صلاحية الرابط منذ:</span> <b>${riyadh}</b>`;
      } catch {
        expBannerEl.textContent = 'الرابط غير صالح.';
      }
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function setProgress(pct) {
      barEl.style.width = `${Math.max(0, Math.min(100, pct))}%`;
    }

    function parseUrls(m3u8Text, baseUrl) {
      return m3u8Text
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l && !l.startsWith('#'))
        .map((l) => new URL(l, baseUrl).toString());
    }

    btnStop.addEventListener('click', () => {
      if (controller) controller.abort();
    });

    btnStart.addEventListener('click', async () => {
      updateExpiry();
      const baseUrl = m3u8UrlEl.value.trim();
      if (!baseUrl.startsWith('http')) {
        setStatus('ضع رابط .m3u8 صحيح أولاً.');
        return;
      }

      controller = new AbortController();
      btnStart.disabled = true;
      btnStop.disabled = false;
      setProgress(0);

      try {
        let text = rawListEl.value.trim();
        if (!text) {
          setStatus('جاري جلب قائمة المقاطع...');
          const res = await fetch(baseUrl, { cache: 'no-store', signal: controller.signal });
          if (!res.ok) throw new Error(`فشل جلب القائمة: HTTP ${res.status}`);
          text = await res.text();
          rawListEl.value = text;
        }

        const all = parseUrls(text, baseUrl);
        if (!all.length) throw new Error('لم يتم العثور على مقاطع في القائمة.');

        const s = Math.max(0, Number.parseInt(startIdxEl.value, 10) || 0);
        const eRaw = endIdxEl.value.trim();
        const e = eRaw === '' ? all.length - 1 : Math.min(all.length - 1, Number.parseInt(eRaw, 10));
        if (s > e) throw new Error('نطاق المقاطع غير صحيح.');

        const target = all.slice(s, e + 1);
        const parts = [];

        setStatus(`بدء سحب ${target.length} مقطع بالترتيب من #${s} إلى #${e}...`);

        for (let i = 0; i < target.length; i++) {
          let buf = null;
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const r = await fetch(target[i], { cache: 'no-store', signal: controller.signal });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              buf = await r.arrayBuffer();
              break;
            } catch (err) {
              if (err.name === 'AbortError') throw err;
              if (attempt === 3) throw new Error(`فشل المقطع #${s + i}: ${err.message}`);
              await new Promise((ok) => setTimeout(ok, 300 * attempt));
            }
          }

          parts.push(buf);
          buf = null;

          const done = i + 1;
          setProgress((done / target.length) * 100);
          if (done % 25 === 0 || done === target.length) {
            setStatus(`تم سحب ${done} من ${target.length} مقطع بالترتيب...`);
          }
        }

        setStatus('جاري تغليف الملف وتجهيز التنزيل في جهازك...');
        const ext = extSelectEl.value;
        const mime = ext === 'mp4' ? 'video/mp4' : 'video/mp2t';
        const blob = new Blob(parts, { type: mime });
        parts.length = 0;

        const blobUrl = URL.createObjectURL(blob);
        const cleanName = (fileNameEl.value.trim() || 'video_720p').replace(/[^\w\-一-龥\u0600-\u06FF]/g, '_');
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `${cleanName}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);

        setStatus(
          `تم التجميع وبدأ التنزيل كملف واحد!\n` +
          `الملف: ${cleanName}.${ext}\n` +
          `الحجم: ${(blob.size / (1024 * 1024)).toFixed(2)} MB`
        );
      } catch (err) {
        if (err.name === 'AbortError') {
          setStatus('تم إيقاف العملية.');
        } else {
          setStatus(`تعذر الإكمال: ${err.message}`);
        }
      } finally {
        controller = null;
        btnStart.disabled = false;
        btnStop.disabled = true;
      }
    });

    m3u8UrlEl.addEventListener('input', updateExpiry);
    updateExpiry();
  </script>
</body>
</html>
